services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: upay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-upay}
      POSTGRES_DB: upay
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U upay"], interval: 3s, retries: 20}
  api:
    build: {context: ., dockerfile: backend/Dockerfile}
    env_file: backend/.env
    depends_on: {db: {condition: service_healthy}}
    ports: ["8000:8000"]
volumes:
  pgdata:
